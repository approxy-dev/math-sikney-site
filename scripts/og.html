<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OG card</title>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("/fonts/space-grotesk-latin.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
      @font-face { font-family: "Plus Jakarta Sans"; src: url("/fonts/plus-jakarta-sans-latin.woff2") format("woff2"); font-weight: 400 700; font-display: block; }
      @font-face { font-family: "JetBrains Mono"; src: url("/fonts/jetbrains-mono-latin.woff2") format("woff2"); font-weight: 400 700; font-display: block; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #ff00ff; }
      #card { width: 960px; height: 504px; position: relative; overflow: hidden; background: #151916; color: #f4f4e9; display: grid; grid-template-columns: 1fr 250px; }
      #card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: #d4ed82; }
      #card::after { content: ""; position: absolute; left: 620px; top: 0; bottom: 0; width: 1px; background: #3d483e; }
      .copy { padding: 48px 40px 38px 58px; display: flex; flex-direction: column; }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand img { width: 44px; height: 44px; }
      .brand b { font-family: "Space Grotesk", sans-serif; font-size: 22px; letter-spacing: -0.02em; }
      .eyebrow { margin: 28px 0 0; font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: 0.13em; color: #b5c0b5; text-transform: uppercase; }
      h1 { margin: 10px 0 0; font-family: "Space Grotesk", sans-serif; font-size: 62px; line-height: 0.96; letter-spacing: -0.05em; font-weight: 600; }
      h1 span { color: #d4ed82; }
      .desc { margin: 17px 0 0; font-family: "Plus Jakarta Sans", sans-serif; font-size: 17px; line-height: 1.45; color: #dbe2d8; max-width: 520px; }
      .facts { margin: 20px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
      .facts span { padding: 7px 11px; border: 1px solid #3d483e; border-radius: 999px; font-family: "JetBrains Mono", monospace; font-size: 11px; color: #b5c0b5; }
      .foot { margin-top: auto; padding-top: 16px; border-top: 1px solid #3d483e; font-family: "JetBrains Mono", monospace; font-size: 11px; color: #96a58f; }
      .foot strong { color: #d4ed82; font-weight: 500; }
      .screen { position: relative; display: grid; place-items: center; overflow: hidden; }
      .screen::before { content: ""; position: absolute; width: 250px; height: 250px; border: 1px solid #3d483e; border-radius: 50%; transform: translate(46px, -46px); }
      .screen img { position: relative; width: 182px; height: auto; border: 1px solid #3d483e; border-radius: 18px; transform: rotate(-2deg); }
      .tag { position: absolute; left: 22px; bottom: 30px; padding: 7px 10px; background: #d4ed82; color: #151916; border-radius: 8px; font-family: "JetBrains Mono", monospace; font-size: 10px; }
    </style>
  </head>
  <body>
    <div id="card" tabindex="0" role="img" aria-label="Math Sikney 1.2.0 social card">
      <div class="copy">
        <div class="brand"><img src="/favicon.svg" alt="" /><b>Math Sikney</b></div>
        <p class="eyebrow">The mental math visualizer</p>
        <h1>Visualize.<br />Hold. <span>Solve.</span></h1>
        <p class="desc">An offline Android trainer. The expression appears, disappears, and you answer from the picture you kept.</p>
        <div class="facts"><span>5 operations</span><span>12 levels</span><span>8 ranks</span><span>40 badges</span></div>
        <div class="foot"><strong>Version 1.2.0</strong> · direct APK &nbsp; / &nbsp; No internet permission</div>
      </div>
      <div class="screen">
        <img src="/og-app.png" alt="" />
        <span class="tag">REAL APP CAPTURE</span>
      </div>
    </div>
  </body>
</html>
