<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Capture</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #151916;
        overflow: hidden;
      }
      #wrap {
        display: block;
        width: max-content;
        overflow: hidden;
      }
      iframe {
        display: block;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="wrap"></div>
    <script>
      const q = new URLSearchParams(location.search);
      const w = Math.max(320, Math.min(1920, Number(q.get("w")) || 360));
      const s = q.get("s") || "intro";
      const height = Math.max(320, Math.min(4000, Number(q.get("h")) || 900));

      const wrap = document.getElementById("wrap");
      wrap.style.width = `${w}px`;
      wrap.style.height = `${height}px`;

      const frame = document.createElement("iframe");
      frame.setAttribute("title", `Capture ${s} at ${w}px`);
      frame.style.width = `${w}px`;
      frame.style.height = `${Math.max(height, 900)}px`;
      frame.src = `/#${s}`;
      wrap.appendChild(frame);

      frame.addEventListener("load", async () => {
        const d = frame.contentDocument;
        const win = frame.contentWindow;
        if (!d || !win) return;

        d.documentElement.style.scrollBehavior = "auto";
        try {
          await d.fonts.ready;
        } catch {}

        await Promise.all(
          Array.from(d.images).map((img) =>
            img.complete
              ? null
              : Promise.race([
                  new Promise((resolve) => {
                    img.addEventListener("load", resolve, { once: true });
                    img.addEventListener("error", resolve, { once: true });
                  }),
                  new Promise((resolve) => setTimeout(resolve, 800)),
                ]),
          ),
        );

        const el = s === "footer" ? d.querySelector("footer") : d.getElementById(s);
        const header = d.querySelector(".topbar");
        const offset =
          header && win.getComputedStyle(header).display !== "none" ? header.offsetHeight : 0;
        const top = el ? el.getBoundingClientRect().top + win.scrollY : 0;

        win.scrollTo(0, Math.max(0, top - offset));

        requestAnimationFrame(() =>
          requestAnimationFrame(() => {
            document.body.dataset.ready = "1";
          }),
        );
      });
    </script>
  </body>
</html>
