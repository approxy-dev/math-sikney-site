<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QA frame</title>
    <style>
      html, body { margin: 0; padding: 0; background: #ff00ff; }
      #wrap { display: block; width: max-content; background: #151916; transform-origin: top left; overflow: hidden; }
      iframe { display: block; border: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="wrap" tabindex="0" role="img" aria-label="QA capture"></div>
    <script>
      const q = new URLSearchParams(location.search);
      const w = Math.max(320, Math.min(1440, Number(q.get("w")) || 360));
      const s = q.get("s") || "intro";
      const y = Math.max(0, Number(q.get("y")) || 0);
      const hParam = q.get("h");
      const full = hParam === "full";
      const requestedH = Number(hParam);
      const scale = Math.min(1, (window.innerWidth - 8) / w);
      const wrap = document.getElementById("wrap");
      wrap.style.width = `${w}px`;
      wrap.style.transform = `scale(${scale})`;

      const frame = document.createElement("iframe");
      frame.setAttribute("title", `QA ${s} at ${w}px`);
      frame.style.width = `${w}px`;
      frame.style.height = "520px";
      frame.src = `/#${s}`;
      wrap.appendChild(frame);

      frame.addEventListener("load", async () => {
        const d = frame.contentDocument;
        const win = frame.contentWindow;
        if (!d || !win) return;
        d.documentElement.style.scrollBehavior = "auto";
        if (d.fonts && d.fonts.ready) {
          try { await d.fonts.ready; } catch {}
        }
        await Promise.all(
          Array.from(d.images).map((img) =>
            img.complete
              ? null
              : Promise.race([
                  new Promise((resolve) => {
                    img.addEventListener("load", resolve, { once: true });
                    img.addEventListener("error", resolve, { once: true });
                  }),
                  new Promise((resolve) => setTimeout(resolve, 600)),
                ])
          )
        );

        const el = s === "footer" ? d.querySelector("footer") : d.getElementById(s);
        const header = d.querySelector(".topbar");
        const offset =
          header && win.getComputedStyle(header).display !== "none" ? header.offsetHeight : 0;

        let h = Number.isFinite(requestedH) && requestedH > 0 ? requestedH : 520;
        if (full && el) h = Math.ceil(el.getBoundingClientRect().height) + offset;
        h = Math.max(320, Math.min(5000, h));
        frame.style.height = `${h}px`;
        wrap.style.height = `${h}px`;

        const top = el ? el.getBoundingClientRect().top + win.scrollY : 0;
        win.scrollTo(0, Math.max(0, top - offset + y));
        requestAnimationFrame(() =>
          requestAnimationFrame(() => {
            document.body.dataset.ready = "1";
          })
        );
      });
    </script>
  </body>
</html>
